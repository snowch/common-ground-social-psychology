name: Package private course release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (with a matching docs/releases/TAG.md)
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable narrated decks
        run: python3 build.py --portable --output out/portable
      - name: Package and verify ZIP
        run: python3 scripts/package_release.py
      - name: Publish private release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a version tag such as v0.1.0."
            exit 1
          fi
          test -f "docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "That release already exists; review it before changing its assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-artifacts/common-ground-af-heart.zip \
            release-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Common Ground $RELEASE_TAG — af_heart narration" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
