<script>
'use strict';
const COURSE=__DATA__;
const RECORDED_AUDIO=__AUDIO__;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state={view:'home',c:0,s:0}, answers={},visited={},revealed={},playing=false,paused=false,utterance=null,generation=0;
let audioPlayer=null;
const storageKey='common-ground-v1';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');answers=saved.answers||{};visited=saved.visited||{};if(saved.position){const i=COURSE.findIndex(c=>c.number===saved.position.chapter);if(i>=0){state.c=i;state.s=Math.min(7,Math.max(0,saved.position.slide||0));}}}catch(e){}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({answers,visited,position:{chapter:COURSE[state.c].number,slide:state.s}}));}catch(e){}}

let artSerial=0;
function scene(mode='room',stage='story'){
 let b='';
 if(stage==='story'||stage==='practice'||stage==='recall'||mode==='room'){
 b=`<path d="M40 345V90Q40 60 70 60H450Q480 60 480 90V345" fill="#E3EBF7" stroke="#152F52" stroke-width="2"/><rect x="188" y="32" width="145" height="58" rx="5" fill="#F2F6FC" stroke="#152F52" stroke-width="2"/>${label(260,58,'Common Ground',17)}${label(260,77,'Repair café',13)}<rect x="70" y="112" width="70" height="85" rx="30" fill="#F2F6FC" stroke="#C5D3E5"/><path d="M105 113V196M71 154H140" stroke="#C5D3E5" stroke-width="2"/>${person(170,220,'#7058A3',.9)}${person(340,220,'#216B88',.9)}${person(255,218,'#A1486D',.8)}<path d="M103 256L415 256L439 282H80Z" fill="#DCA64C" stroke="#152F52" stroke-width="2"/><path d="M114 281V365M400 281V365" stroke="#152F52" stroke-width="8"/><rect x="229" y="227" width="63" height="29" rx="5" fill="#F2F6FC" stroke="#152F52" stroke-width="2"/><path d="M238 226Q244 210 252 226M268 232H283" fill="none" stroke="#152F52" stroke-width="3"/><path d="M24 371H496" stroke="#152F52" stroke-width="2"/>${label(165,407,'Maya',16)}${label(257,407,'Sam',16)}${label(345,407,'Leo',16)}`;
 if(stage==='concept')b=box(38,50,160,65,'Person')+box(322,50,160,65,'Situation')+arrow(118,130,215,215)+arrow(402,130,307,215)+person(260,265,'#216B88',1.1)+label(260,405,'Behavior emerges in context.',18);
 }else if(mode==='experiment'){
 b=box(160,35,200,58,'Comparable households')+arrow(230,105,130,162)+arrow(290,105,390,162)+box(40,180,180,68,'Invitation A')+box(300,180,180,68,'Invitation B')+arrow(130,264,130,300)+arrow(390,264,390,300)+box(40,315,180,65,'Attendance')+box(300,315,180,65,'Attendance')+label(260,423,'Allocate by chance. Compare like with like.',17);
 }else if(mode==='filter'){

 }else if(mode==='dissonance'){

 }else if(mode==='crowd'){
 b=person(100,145,'#216B88',.9)+person(260,145,'#216B88',.9)+person(420,145,'#A1486D',.9)+box(37,25,125,44,'Yes')+box(197,25,125,44,'Yes')+box(357,25,125,44,'Yes?')+box(30,300,210,72,'To be accepted')+box(280,300,210,72,'To be accurate')+label(260,422,'The same answer can have different motives.',17);
 }else if(mode==='message'){

 }else if(mode==='groups'){

 }else if(mode==='relationship'){

 }

}

function header(){return `<header class="top"><a href="#home" class="brand" aria-label="Common Ground home">${logo()}<span>Common Ground</span></a><div class="top-actions"><button class="quiet small" id="homeButton">Chapters</button><button class="small print-btn" id="printButton">Print deck / PDF</button></div></header>`}
function completed(c){return c.slides.filter(s=>visited[s.id]).length}
function home(){
 $('#app').innerHTML=header()+`<main class="wrap"><section class="hero"><div><p class="intro">Social psychology in ten stories</p><h1>People make<br>more sense<br>in context.</h1><p>Join a neighborhood repair café. Discover why we judge, conform, justify, connect—and sometimes help.</p><div class="hero-actions"><button id="start" class="primary">Start the story</button><button id="resume">Resume learning</button></div><p class="hero-note muted">${COURSE.length} short chapter${COURSE.length===1?'':'s'} · ${COURSE.length*8} slides · ${COURSE.length*2} decisions<br>${COURSE.length===1?'About 6–9 minutes':'About 60–90 minutes'} with practice, at your pace.</p></div><div class="art">${scene('room','story')}</div></section><section aria-labelledby="contents-title"><div class="course-heading"><h2 id="contents-title">One café. Ten ways to understand it.</h2><p class="muted small">Choose a chapter or follow the story in order.</p></div><div class="chapters">${COURSE.map((c,i)=>`<button class="chapter" data-chapter="${i}"><span class="chapter-num">${String(c.number).padStart(2,'0')}</span><span><span class="chapter-name">${esc(c.title)}</span><span class="chapter-topic">${esc(c.topic)}</span></span><span class="chapter-status" aria-label="${completed(c)} of 8 slides visited">${completed(c)===8?'✓':completed(c)?completed(c)+'/8':'↗'}</span></button>`).join('')}</div></section><section class="how"><div><h3>Learn by making a decision.</h3><p>Each chapter starts with a problem. Choose an action, learn two useful ideas, inspect the evidence, and apply them in a new situation. Recall questions and a field exercise help you move beyond recognition.</p></div><div><h3>Listen, pause, explain.</h3><p>Listen to recorded narration in the warm Kokoro af_heart voice, or read the full transcript. The recordings are included in this deck and work offline. Your progress is saved in this browser when storage is available. Come back tomorrow and in a week to practice recall.</p></div></section><footer class="footer">An original introductory course, independently organized. It does not reproduce <em>The Social Animal</em> or claim equivalent coverage of its 480 pages. Stories and illustrations are original; café characters are fictional. Open reading is linked in each chapter.<br>Built using snowch’s record-demo script format, an instructional-design skill, and a frontend-design skill. <a href="#about">About the course and production</a>.</footer></main>`;
 $('#start').onclick=()=>go(0,0);$('#resume').onclick=()=>go(state.c,state.s);document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>go(+b.dataset.chapter,0));bindHeader();
}
function slideHTML(c,s,printing=false){
 const q=s.quiz,chosen=answers[s.id];
 let body='';
 if(q){body=`<p class="question">${esc(q.prompt)}</p><div class="choices">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" data-answer="${i}" aria-pressed="${chosen===i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><p class="feedback" aria-live="polite">${printing?`Suggested answer: ${String.fromCharCode(65+q.correct)}. ${esc(q.feedback[q.correct])}`:chosen!==undefined?`<span class="correct-label">${chosen===q.correct?'Good application.':'Consider the consequence.'}</span> ${esc(q.feedback[chosen])}`:'Choose an action to explore its consequence.'}</p>`;}
 else if(s.kind==='evidence'){body=`<p class="evidence-body">${esc(s.text)}</p>`;}
 else{body=`<ul class="slide-points">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;}
 if(s.kind==='recall'){body+=printing||revealed[s.id]?`<div class="answers">${s.answers.map((a,i)=>`<p>${i+1}. ${esc(a)}</p>`).join('')}</div>`:'<button class="reveal" id="reveal">Reveal suggested answers</button>';}
 if(s.kind==='practice')body+='<p class="practice-tip">Revisit tomorrow and in a week.<br>Explain it without notes, then use a different example.</p>';
 return `<section class="slide ${s.kind}" style="--accent:${c.color}" aria-label="Chapter ${c.number}, ${s.stage}"><div class="slide-copy"><div class="slide-stage">${printing?'Chapter '+c.number+' · ':''}${esc(s.stage)}</div><h2 id="slideTitle" tabindex="-1">${esc(s.title)}</h2>${body}<div class="scene-tag">${printing?esc(c.title)+' · '+s.id:s.kind==='story'?'The Common Ground stories':s.kind==='practice'?'One useful idea, put to work.':''}</div></div><div class="slide-art">${scene(c.icon,s.kind)}<div class="art-caption">${s.kind==='story'?'A fictional story. A real question about people.':s.kind==='concept'?esc(diagramCaptions[c.icon]):s.kind==='evidence'?'Conceptual illustration; no research data are plotted.':s.kind==='practice'?'Take the question into a different setting.':'Maya, Sam and Leo at the repair café.'}</div></div></section>`;
}
function player(){
 const c=COURSE[state.c],s=c.slides[state.s];visited[s.id]=true;save();document.documentElement.style.setProperty('--accent',c.color);
 $('#app').innerHTML=header()+`<main class="player"><div class="player-heading"><div><div class="chapter-label">Chapter ${c.number} of 10 · ${esc(c.topic)}</div><h1 class="player-title">${esc(c.title)}</h1></div><div class="stage-track" aria-label="Chapter slides">${c.slides.map((x,i)=>`<button class="${i===state.s?'on':''}" data-stage="${i}" aria-label="${esc(x.stage)}" ${i===state.s?'aria-current="step"':''}></button>`).join('')}</div></div>${slideHTML(c,s)}<div class="player-controls"><div class="audio-group"><button id="read" class="primary">Play narration</button><button id="pause" disabled>Pause</button><button id="stop" disabled>Stop</button><label class="sr-only" for="speed">Narration speed</label><select id="speed"><option value="0.85">0.85× speed</option><option value="1" selected>1× speed</option><option value="1.15">1.15× speed</option></select></div><div class="nav-group"><button id="prev" ${state.c===0&&state.s===0?'disabled':''}>Previous</button><span class="slide-number">${state.s+1} / 8</span><button class="primary" id="next">${state.s===7?(state.c===COURSE.length-1?'Finish chapter':'Next chapter'):'Next'}</button></div></div><p id="audioStatus" class="audio-status" aria-live="polite">Recorded narration · Kokoro af_heart · Original speed 1.0. Exercises wait for your response.</p><div class="transcript"><details open><summary>Full narration transcript</summary><p>${esc(s.text)}</p>${qTranscript(s)}<p class="progress-caption">Slide visits and choices stay on this browser when storage is available. A visit is not a mastery score.</p></details><aside class="resources"><h3>What you will be able to do</h3><p class="objective">${esc(c.objective)}</p><h3>Open reading for this chapter</h3>${c.refs.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join('')}<p class="small muted">Sources are further reading, not reproduced passages. Evidence checks are selective; this is not an exhaustive literature review.</p></aside></div></main>`;
 $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#read').onclick=read;$('#pause').onclick=togglePause;$('#stop').onclick=stop;
 $('#speed').value=String(window.readSpeed||1);$('#speed').onchange=e=>{window.readSpeed=+e.target.value;if(audioPlayer)audioPlayer.playbackRate=window.readSpeed;};
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(state.c,+b.dataset.stage));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(+b.dataset.answer));if($('#reveal'))$('#reveal').onclick=()=>{stop();revealed[s.id]=true;player();};bindHeader();

}
function qTranscript(s){return s.quiz?`<p class="small muted">The recording also reads the three choices. After you choose, play the narration again to hear your selected feedback. Exercises wait for you to continue.</p>`:'';}
function choose(i){const s=COURSE[state.c].slides[state.s];stop();answers[s.id]=i;save();player();const b=document.querySelector(`[data-answer="${i}"]`);if(b)b.focus();}
function go(c,s){stop();state={view:'player',c,s};location.hash=`chapter-${COURSE[c].number}-slide-${s+1}`;player();window.scrollTo(0,0);}
function move(d){let c=state.c,s=state.s+d;if(s<0){c--;s=7;}if(s>7){c++;s=0;}if(c<0)return;if(c>=COURSE.length){stop();state.view='home';location.hash='home';home();window.scrollTo(0,0);return;}go(c,s);}
function bindHeader(){if($('#homeButton'))$('#homeButton').onclick=()=>{location.hash='home';};if($('#printButton'))$('#printButton').onclick=()=>{buildPrint();window.print();};}
function stop(){
 generation++;if(audioPlayer){audioPlayer.pause();audioPlayer.onended=null;audioPlayer.onerror=null;audioPlayer.removeAttribute('src');audioPlayer.load();audioPlayer=null;}
 playing=false;paused=false;if($('#read'))$('#read').textContent='Play narration';if($('#pause')){$('#pause').disabled=true;$('#pause').textContent='Pause';}if($('#stop'))$('#stop').disabled=true;if($('#audioStatus'))$('#audioStatus').textContent='Narration stopped. Play this slide again whenever you are ready.';
}
function read(){
 stop();const current=++generation;const s=COURSE[state.c].slides[state.s];const queue=[s.id];
 if(s.quiz&&answers[s.id]!==undefined)queue.push(s.id+'-feedback-'+answers[s.id]);
 if(s.kind==='recall'&&revealed[s.id])queue.push(s.id+'-answers');
 let i=0;
 function failed(){if(current!==generation)return;stop();$('#audioStatus').textContent='This browser could not play the recording. Try another modern browser or use the downloadable chapter audio and transcript.';}
 function playNext(){
  if(current!==generation)return;
  if(i>=queue.length){playing=false;paused=false;$('#read').textContent='Play again';$('#pause').disabled=true;$('#stop').disabled=true;$('#audioStatus').textContent='Narration complete. Continue when you are ready.';return;}
  const recording=RECORDED_AUDIO[queue[i++]];if(!recording){failed();return;}
  audioPlayer=new Audio(recording);audioPlayer.preload='auto';audioPlayer.playbackRate=window.readSpeed||1;audioPlayer.onended=playNext;audioPlayer.onerror=failed;
  const pending=audioPlayer.play();if(pending)pending.catch(failed);
 }
 playing=true;$('#read').textContent='Restart narration';$('#pause').disabled=false;$('#stop').disabled=false;$('#audioStatus').textContent='Playing recorded Kokoro af_heart narration.';playNext();
}
function togglePause(){
 if(!playing||!audioPlayer)return;
 if(paused){paused=false;$('#pause').textContent='Pause';$('#audioStatus').textContent='Narration resumed.';const pending=audioPlayer.play();if(pending)pending.catch(()=>{stop();$('#audioStatus').textContent='Playback could not resume. Start this slide again.';});}
 else{audioPlayer.pause();paused=true;$('#pause').textContent='Resume';$('#audioStatus').textContent='Narration paused.';}
}
function buildPrint(){ $('#print').innerHTML=COURSE.flatMap(c=>c.slides.map(s=>slideHTML(c,s,true))).join('');}
function about(){stop();state.view='about';$('#app').innerHTML=header()+`<main class="wrap" style="padding-top:45px;max-width:1000px"><h1 style="font-size:48px">About Common Ground</h1><p>This is an original introductory social psychology course in ten independently organized chapters. It is not a chapter-by-chapter adaptation of Elliot and Joshua Aronson’s <em>The Social Animal</em>, and it does not claim the same depth or full coverage.</p><h3>Learning design</h3><p>Scenario-first instruction, prediction, explanatory feedback, transfer, retrieval, and field practice. The suggested tomorrow/one-week revisit plan is a starting point. This course has not had an expert accuracy review or a learner pilot.</p><h3>Skills applied</h3><p><a href="https://github.com/joelrkohlman/instructional-design/blob/main/SKILL.md">Instructional Design</a>: applied objectives, scenarios, plausible distractors, evidence limits.<br><a href="https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md">Frontend Design</a>: an intentional palette, type system, illustrated workshop setting, and accessible controls.<br><a href="https://github.com/snowch/claude-skills/blob/c9a7c521568632aa216932f4c965df386498602a/plugins/demo-video/skills/record-demo/SKILL.md">snowch’s record-demo</a>: scene-based narration script and recording-ready scene manifest.</p><h3>Narration</h3><p>The deck embeds prerecorded Kokoro v1.0 af_heart narration at speed 1.0, generated with the Linux ONNX CPU backend used by the newer metadata-book Chapter 1. Speech is normalized to a target of −16 LUFS, encoded as 48 kHz AAC, and screened with independent Whisper transcription. Transcription screening is not a human listening review. The same audio is used on every device; no browser text-to-speech voice is selected.</p><h3>Sources and rights</h3><p>Stories, teaching text, and diagrams are original. Linked OpenStax and Noba material provides further study under each source’s own terms. No Aronson textbook passages, figures, or exercises are reproduced. Embedded URW fonts retain their license information in the download package. Diagrams are conceptual; hypothetical numbers are labeled as such.</p><h3>Using the deck</h3><p>Open the HTML file in a modern browser. Use Previous/Next or the arrow keys outside controls. Play narration, pause, and stop control the included recordings. Use Print deck / PDF for a static copy. Quizzes and embedded narration work offline. External reading requires a connection.</p><p><a href="#home">Return to chapters</a></p></main>`;bindHeader();}
function route(){const m=location.hash.match(/^#chapter-(\d+)-slide-(\d+)$/);if(m){const i=COURSE.findIndex(c=>c.number===+m[1]);const s=+m[2]-1;if(i>=0&&s>=0&&s<8){stop();state={view:'player',c:i,s};player();return;}}if(location.hash==='#about'){about();return;}stop();state.view='home';home();}
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(state.view!=='player'||e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});window.addEventListener('beforeprint',buildPrint);window.addEventListener('beforeunload',()=>{if(audioPlayer)audioPlayer.pause();});
if(COURSE.length===1&&!location.hash)history.replaceState(null,'','#chapter-'+COURSE[0].number+'-slide-1');if(location.search.includes('print=1')){buildPrint();}route();
</script></body></html>
