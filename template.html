function completed(c){return c.slides.filter(s=>visited[s.id]).length}
function home(){
 $('#app').innerHTML=header()+`<main id="main" class="wrap"><section class="hero"><div class="hero-copy"><p class="intro">Social psychology in ten stories</p><h1>People make<br>more sense<br>in context.</h1><p>Join a neighborhood repair café. Discover why we judge, conform, justify, connect—and sometimes help.</p><div class="hero-actions"><button id="start" class="primary">Start the story</button><button id="resume">Resume learning</button></div><p class="hero-note muted">${COURSE.length} short chapter${COURSE.length===1?'':'s'} · ${COURSE.length*8} slides · ${COURSE.length*2} decisions<br>${COURSE.length===1?'About 6–9 minutes':'About 60–90 minutes'} with practice, at your pace.</p></div><div class="art">${scene('room','story')}</div></section><section aria-labelledby="contents-title"><div class="course-heading"><h2 id="contents-title">${COURSE.length===1?'Explore this chapter.':'Ten chapters, one café.'}</h2><p class="muted small">Choose a chapter or follow the story in order.</p></div><div class="chapters">${COURSE.map((c,i)=>`<button class="chapter" data-chapter="${i}"><span class="chapter-num">${String(c.number).padStart(2,'0')}</span><span><span class="chapter-name">${esc(c.title)}</span><span class="chapter-topic">${esc(c.topic)}</span></span><span class="chapter-status" aria-label="${completed(c)} of 8 slides visited">${completed(c)===8?'✓':completed(c)?completed(c)+'/8':'Not started'}</span></button>`).join('')}</div></section><section class="practice-bridge" aria-labelledby="bridge-title"><div><h2 id="bridge-title">Take the ideas beyond the café.</h2><p>Try a written case in a different setting. Give yourself 20–30 minutes to explain your reasoning.</p></div><div class="bridge-actions"><a class="button" href="#case">Try the final case</a>${COURSE.length===10?'<span class="companion-links"><a href="study-guide.html">Read the study companion</a><br><a href="study-guide.pdf">Download its PDF</a></span>':''}</div></section><section class="how"><div><h3>Learn by making a decision.</h3><p>Each chapter starts with a problem. Choose an action, learn two useful ideas, inspect the evidence, and apply them in a new situation. Recall questions and a field exercise help you move beyond recognition.</p></div><div><h3>Listen, pause, explain.</h3><p>Listen to recorded narration in the warm Kokoro af_heart voice, or read the recording transcript. The recordings are included in this deck and work offline. ${esc(storageNotice())} Come back tomorrow and in a week to practice recall.</p></div></section><footer class="footer">Explore social psychology through ten fictional café stories. Practice explaining behavior, checking evidence, and applying ideas. Further reading is linked in each chapter.<br><a href="#about">How to use the course, sources, and scope</a>.</footer></main>`;
 $('#start').onclick=()=>go(0,0);$('#resume').onclick=()=>go(state.c,state.s);document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>go(+b.dataset.chapter,0));bindHeader();
}
function slideHTML(c,s,printing=false){
 const q=s.quiz,chosen=printing?undefined:answers[s.id],showFeedback=checked[s.id]&&chosen!==undefined;
 let body='';
 if(q){body=`<p class="question">${esc(q.prompt)}</p><div class="choices">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" data-answer="${i}" aria-pressed="${chosen===i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><p class="feedback" aria-live="polite">${printing?`Suggested answer: ${String.fromCharCode(65+q.correct)}. ${esc(q.feedback[q.correct])}`:showFeedback?`<span class="correct-label">${chosen===q.correct?'Good application.':'Consider the consequence.'}</span> ${esc(q.feedback[chosen])}`:'Choose an action, then explain why before checking.'}</p>${printing?'':`<button id="checkChoice" class="check-choice" ${chosen===undefined||showFeedback?'disabled':''}>Check choice</button>${showFeedback?'<button id="playFeedback" class="check-choice">Play feedback</button>':''}`}`;}
 else if(s.kind==='evidence'){body=`<p class="evidence-body">${esc(s.text)}</p>`;}
 else{body=`<ul class="slide-points">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;}
 if(s.kind==='recall'){body+=printing||revealed[s.id]?`<div class="answers">${s.answers.map((a,i)=>`<p>${i+1}. ${esc(a)}</p>`).join('')}</div>`:'<button class="reveal" id="reveal">Reveal suggested answers</button>';}
 if(s.kind==='practice'&&!printing&&c.number===10)body+='<p><a href="#case">Try the end-of-course case</a></p>';
 if(s.kind==='practice')body+='<p class="practice-tip">Revisit tomorrow and in a week.<br>Explain it without notes, then use a different example.</p>';
 return `<section class="slide ${s.kind}" style="--accent:${c.color}" aria-label="Chapter ${c.number}, ${s.stage}"><div class="slide-copy"><div class="slide-stage">${printing?'Chapter '+c.number+' · ':''}${esc(s.stage)}</div><h2 id="${printing?'print-'+s.id:'slideTitle'}" tabindex="-1">${esc(s.title)}</h2>${body}<div class="scene-tag">${printing?esc(c.title)+' · '+s.id:s.kind==='story'?'The Common Ground stories':s.kind==='practice'?'One useful idea, put to work.':''}</div></div><div class="slide-art">${scene(c.icon,s.kind)}<div class="art-caption">${s.kind==='story'?'A fictional story. A real question about people.':s.kind==='concept'?esc(diagramCaptions[c.icon]):s.kind==='evidence'?'Conceptual illustration; no research data are plotted.':s.kind==='practice'?'Take the question into a different setting.':'Maya, Sam and Leo at the repair café.'}</div></div></section>`;
}
function player(){
 const c=COURSE[state.c],s=c.slides[state.s];visited[s.id]=true;save();document.documentElement.style.setProperty('--accent',c.color);
 $('#app').innerHTML=header()+`<main id="main" class="player"><div class="player-heading"><div><div class="chapter-label">Chapter ${c.number} of 10 · ${esc(c.topic)}</div><h1 class="player-title">${esc(c.title)}</h1></div><div class="stage-track" aria-label="Chapter slides">${c.slides.map((x,i)=>`<button class="${i===state.s?'on':''}" data-stage="${i}" aria-label="${esc(x.stage)}" ${i===state.s?'aria-current="step"':''}></button>`).join('')}</div></div><div class="player-controls"><div class="audio-group"><button id="read" class="primary">Play narration</button><button id="pause" disabled>Pause</button><button id="stop" disabled>Stop</button><label class="sr-only" for="speed">Narration speed</label><select id="speed"><option value="0.85">0.85× speed</option><option value="1" selected>1× speed</option><option value="1.15">1.15× speed</option></select></div><div class="nav-group"><button id="prev" ${state.c===0&&state.s===0?'disabled':''}>Previous</button><span class="slide-number">${state.s+1} / 8</span><button class="primary" id="next">${state.s===7?(state.c===COURSE.length-1?'Finish chapter':'Next chapter'):'Next'}</button></div></div>${slideHTML(c,s)}<p id="audioStatus" class="audio-status" aria-live="polite">Listen or read, then continue at your own pace. Exercises wait for your response.</p><div class="transcript"><details open><summary>Recording transcript</summary><p>${esc(NARRATION_TEXT[s.id]||s.text)}</p>${qTranscript(s)}<p class="progress-caption">${esc(storageNotice())}</p></details><aside class="resources"><h3>What you will be able to do</h3><p class="objective">${esc(c.objective)}</p><details class="chapter-reading" ${s.kind==='evidence'?'open':''}><summary>Evidence and further reading</summary>${evidenceHTML(c)}<h3>Open reading for this chapter</h3>${c.refs.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join('')}<p class="small muted">The links support further reading. Evidence checks are selective; this is not an exhaustive literature review.</p></details></aside></div></main>`;
 $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#read').onclick=read;$('#pause').onclick=togglePause;$('#stop').onclick=stop;
 $('#speed').value=String(window.readSpeed||1);$('#speed').onchange=e=>{window.readSpeed=+e.target.value;if(audioPlayer)audioPlayer.playbackRate=window.readSpeed;};
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(state.c,+b.dataset.stage));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(+b.dataset.answer));if($('#reveal'))$('#reveal').onclick=()=>{stop();revealed[s.id]=true;player();$('#slideTitle').focus({preventScroll:true});};if($('#checkChoice'))$('#checkChoice').onclick=()=>{stop();checked[s.id]=true;save();player();$('.feedback').tabIndex=-1;$('.feedback').focus({preventScroll:true});};if($('#playFeedback'))$('#playFeedback').onclick=()=>read([s.id+'-feedback-'+answers[s.id]]);bindHeader();

}
function evidenceHTML(c){const e=EVIDENCE[String(c.number)];return `<div class="evidence-note"><h3>Evidence and limits</h3><p>${esc(e.note)}</p>${e.sources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a><p class="small muted">${esc(r.kind)}</p>`).join('')}</div>`;}
function qTranscript(s){let text='';if(s.quiz&&checked[s.id])text=NARRATION_TEXT[s.id+'-feedback-'+answers[s.id]];if(s.kind==='recall'&&revealed[s.id])text=NARRATION_TEXT[s.id+'-answers'];return text?`<p style="white-space:pre-line">${esc(text)}</p>`:'';}
function choose(i){const s=COURSE[state.c].slides[state.s];stop();answers[s.id]=i;delete checked[s.id];save();player();const b=document.querySelector(`[data-answer="${i}"]`);if(b)b.focus();}
function go(c,s){const hash=`#chapter-${COURSE[c].number}-slide-${s+1}`;if(location.hash===hash){route();}else location.hash=hash;}
function move(d){let c=state.c,s=state.s+d;if(s<0){c--;s=7;}if(s>7){c++;s=0;}if(c<0)return;if(c>=COURSE.length){location.hash=COURSE[c-1].number===10?'case':'home';return;}go(c,s);}
function bindHeader(){if($('#homeButton'))$('#homeButton').onclick=()=>{location.hash='home';};if($('#printButton'))$('#printButton').onclick=()=>{buildPrint();window.print();};}
function stop(){
 generation++;if(audioPlayer){audioPlayer.pause();audioPlayer.onended=null;audioPlayer.onerror=null;audioPlayer.removeAttribute('src');audioPlayer.load();audioPlayer=null;}
 playing=false;paused=false;if($('#read'))$('#read').textContent='Play narration';if($('#pause')){$('#pause').disabled=true;$('#pause').textContent='Pause';}if($('#stop'))$('#stop').disabled=true;if($('#audioStatus'))$('#audioStatus').textContent='Narration stopped. Play this slide again whenever you are ready.';
}
function read(onlyQueue){
 stop();const current=++generation;const s=COURSE[state.c].slides[state.s];const queue=Array.isArray(onlyQueue)?onlyQueue.slice():[s.id];
 if(!Array.isArray(onlyQueue)&&s.quiz&&checked[s.id])queue.push(s.id+'-feedback-'+answers[s.id]);
 if(!Array.isArray(onlyQueue)&&s.kind==='recall'&&revealed[s.id])queue.push(s.id+'-answers');
 let i=0;
 function failed(){if(current!==generation)return;stop();$('#audioStatus').textContent='This browser could not play the recording. Try another modern browser or use the downloadable chapter audio and transcript.';}
 function playNext(){
  if(current!==generation)return;
  if(i>=queue.length){playing=false;paused=false;$('#read').textContent='Play again';$('#pause').disabled=true;$('#stop').disabled=true;$('#audioStatus').textContent='Narration complete. Continue when you are ready.';return;}
  const recording=RECORDED_AUDIO[queue[i++]];if(!recording){failed();return;}
  audioPlayer=new Audio(recording);audioPlayer.preload='auto';audioPlayer.playbackRate=window.readSpeed||1;audioPlayer.onended=playNext;audioPlayer.onerror=failed;
  const pending=audioPlayer.play();if(pending)pending.catch(failed);
 }
 playing=true;$('#read').textContent='Restart narration';$('#pause').disabled=false;$('#stop').disabled=false;$('#audioStatus').textContent='Playing this scene.';playNext();
}
function togglePause(){
 if(!playing||!audioPlayer)return;
 if(paused){paused=false;$('#pause').textContent='Pause';$('#audioStatus').textContent='Narration resumed.';const pending=audioPlayer.play();if(pending)pending.catch(()=>{stop();$('#audioStatus').textContent='Playback could not resume. Start this slide again.';});}
 else{audioPlayer.pause();paused=true;$('#pause').textContent='Resume';$('#audioStatus').textContent='Narration paused.';}
}
function buildPrint(){ $('#print').innerHTML=COURSE.flatMap(c=>c.slides.map(s=>slideHTML(c,s,true))).join('');}
function learningCase(){stop();state.view='case';const c=LEARNING_CHECK;$('#app').innerHTML=header()+`<main id="main" class="wrap case-wrap"><p class="muted">${esc(c.subtitle)}</p><h1>${esc(c.title)}</h1><p>${esc(c.intro)}</p><section aria-labelledby="case-story"><h2 id="case-story">The language club</h2>${c.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</section><section aria-labelledby="case-tasks"><h2 id="case-tasks">Write your reasoning</h2><ol>${c.tasks.map(t=>`<li><strong>${esc(t.title)}</strong><p>${esc(t.prompt)}</p></li>`).join('')}</ol></section><details><summary>Compare with suggested reasoning</summary>${c.tasks.map((t,i)=>`<h3>${i+1}. ${esc(t.title)}</h3><p>${esc(t.answer)}</p><p class="small muted">Revisit chapters ${t.chapters.join(', ')}.</p>`).join('')}</details><details><summary>Assess your explanation</summary><div class="case-rubric">${c.rubric.map(r=>`<div><h3>${esc(r.title)}</h3><p><strong>Stronger:</strong> ${esc(r.strong)}</p><p><strong>Needs development:</strong> ${esc(r.developing)}</p></div>`).join('')}</div><p>${esc(c.followup)}</p></details><p class="notice">This optional case is a reading and writing exercise. It has no recorded narration.</p><p><a href="#home">Return to chapters</a></p></main>`;bindHeader();focusMain();}
function about(){stop();state.view='about';$('#app').innerHTML=header()+`<main id="main" class="wrap" style="padding-top:45px;max-width:1000px"><h1 style="font-size:48px">About Common Ground</h1><p>Common Ground is an introductory social psychology course in ten chapters. Fictional stories, decisions, evidence notes, and recall exercises help you explain everyday behavior and examine your assumptions.</p><h3>Learning design</h3><p>Scenario-first instruction, prediction, explanatory feedback, transfer, retrieval, and field practice. The suggested tomorrow/one-week revisit plan is a starting point. The end-of-course case asks you to explain and test ideas in a different setting. Suggested reasoning and a rubric support self-assessment. This course has had an internal evidence and usability review; it has not had an independent academic review or a learner pilot.</p><h3>Listen and read</h3><p>Use Play narration, Pause, and Stop. Select a choice, explain your reasoning, then use Check choice for feedback. The transcript follows the recording; feedback and recall answers appear after you reveal them. The optional final written case has no audio. Technical production details and skill credits are in the repository documentation.</p><h3>Sources and rights</h3><p>Research readings are linked under each chapter. OpenStax and Noba provide further study under their own terms. Libre Baskerville and Arimo fonts are included under the SIL Open Font License; their complete notices are embedded in this HTML and included in the download package. Narration uses Kokoro af_heart. Asset credits and production sources are recorded in THIRD-PARTY-NOTICES.txt. Diagrams are conceptual; hypothetical numbers are labeled as such.</p><h3>Using the deck</h3><p>Open the HTML file in a modern browser. Use Previous/Next or the arrow keys outside controls. Play narration, pause, and stop control the included recordings. Use Print deck / PDF for a static copy. Quizzes and embedded narration work offline. External reading requires a connection.</p><p><a href="#home">Return to chapters</a></p></main>`;bindHeader();}
function route(){const m=location.hash.match(/^#chapter-(\d+)-slide-(\d+)$/);if(m){const i=COURSE.findIndex(c=>c.number===+m[1]);const s=+m[2]-1;if(i>=0&&s>=0&&s<8){stop();state={view:'player',c:i,s};player();focusMain();return;}}if(location.hash==='#case'){learningCase();return;}if(location.hash==='#about'){about();focusMain();return;}stop();state.view='home';home();focusMain();}
$('.skip').onclick=e=>{e.preventDefault();const main=$('#main');if(main){main.tabIndex=-1;main.focus();}};
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(state.view!=='player'||e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY|A/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});window.addEventListener('beforeprint',buildPrint);window.addEventListener('beforeunload',()=>{if(audioPlayer)audioPlayer.pause();});
if(COURSE.length===1&&!location.hash)history.replaceState(null,'','#chapter-'+COURSE[0].number+'-slide-1');if(location.search.includes('print=1')){buildPrint();}route();
</script></body></html>
