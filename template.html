const GLOSSARY=__GLOSSARY__;
function chapterTerms(c){return Object.entries(GLOSSARY[String(c.number)]||{}).sort((a,b)=>b[0].length-a[0].length);}
function termHTML(text,c,printing=false,seen=new Set()){
 if(printing)return esc(text);
 const terms=chapterTerms(c), pattern=terms.map(([term])=>term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
 if(!pattern)return esc(text);
 const re=new RegExp('(?<![\\p{L}])('+pattern+')(?![\\p{L}])','giu');
 let html='',end=0;
 for(const m of text.matchAll(re)){const i=terms.findIndex(([term])=>term.toLowerCase()===m[0].toLowerCase());if(seen.has(i))continue;seen.add(i);html+=esc(text.slice(end,m.index))+`<button class="glossary-term" popovertarget="term-${i}" aria-label="Define ${esc(m[0])}">${esc(m[0])}</button>`;end=m.index+m[0].length;}
 return html+esc(text.slice(end));
}
function paragraphs(text,c,printing=false){
 const seen=new Set();
 return text.trim().split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${termHTML(p,c,printing,seen)}</p>`).join('');
}
function glossaryHTML(c){const terms=chapterTerms(c);return `<details class="chapter-glossary"><summary>Chapter glossary (${terms.length} terms)</summary><p class="small muted">Select an underlined term in the lesson for a quick definition.</p><dl>${terms.slice().sort((a,b)=>a[0].localeCompare(b[0])).map(([term,definition])=>`<dt>${esc(term)}</dt><dd>${esc(definition)}</dd>`).join('')}</dl></details>${terms.map(([term,definition],i)=>`<div popover id="term-${i}" class="term-definition"><button class="term-close" popovertarget="term-${i}" popovertargetaction="hide" aria-label="Close definition">Close</button><h3>${esc(term)}</h3><p>${esc(definition)}</p></div>`).join('')}`;}
function moreVisuals(slide){
 const views=visualLessons[slide.id]?.slice(1)||[];
 return views.length?`<details class="more-visuals"><summary>Additional illustrations (${views.length})</summary>${views.map(v=>`<figure data-visual-view="${esc(v.key)}"><h3>${esc(v.title)}</h3>${v.render()}<figcaption>${esc(v.caption)}</figcaption></figure>`).join('')}</details>`:'';
}
function conceptPointHTML(point,c,printing){
 const colon=point.indexOf(':');
 return colon>0&&colon<50?`<strong>${termHTML(point.slice(0,colon),c,printing)}</strong>${termHTML(point.slice(colon),c,printing)}`:termHTML(point,c,printing);
}
function researchHTML(s,printing){
 const r=s.research;
 if(!r)return '';
 if(printing)return `<p class="print-research-sources">Research: ${r.sources.map(source=>`<a href="${esc(source.url)}">${esc(source.title.split(',')[0])}</a>`).join(' · ')}</p>`;
 return `<details class="lesson-research"><summary><span class="research-label"><svg class="research-book" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5C9 3.5 5.5 3.5 2.5 4.5v15c3-1 6.5-1 9.5 1 3-2 6.5-2 9.5-1v-15c-3-1-6.5-1-9.5 1Z"/><path d="M12 5.5v15"/></svg><span>Research behind this</span></span><svg class="research-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="research-content">${r.sections.map(section=>`<section><h3>${esc(section.heading)}</h3><p>${esc(section.text)}</p></section>`).join('')}<section><h3>Sources</h3>${r.sources.map(source=>`<p><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a><br><span class="research-kind">${esc(source.kind)}</span></p>`).join('')}</section></div></details>`;
}
function quizContextHTML(q){
 const record=q.record;
 return (q.context?`<p class="quiz-context">${esc(q.context)}</p>`:'')+(record?`<table class="quiz-record"><caption>${esc(record.caption)}</caption><thead><tr>${record.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${record.rows.map(row=>`<tr>${row.map((cell,i)=>i===0?`<th scope="row">${esc(cell)}</th>`:`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'');
}
function quizFeedback(q,chosen){
 const label=q.feedbackLabels?.[chosen]||(chosen===q.correct?'Best-supported choice.':'');
 return (label?`<strong class="correct-label">${esc(label)}</strong> `:'')+esc(q.feedback[chosen]);
}
function recallAnswers(s){
 return `<ol class="answers">${s.answers.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>`;
}
function slideHTML(c,s,printing=false){
 const q=s.quiz,chosen=printing?undefined:answers[s.id],showFeedback=checked[s.id]&&chosen!==undefined;
 let body='';
 if(q){
  const prompt=q.reasoningPrompt?(printing?`<p class="reasoning-print">${esc(q.reasoningPrompt)}</p>`:`<div class="reasoning-field"><label for="decisionReasoning">${esc(q.reasoningPrompt)}</label><textarea id="decisionReasoning" rows="3" maxlength="5000" aria-describedby="reasoningNote">${esc(reasoning[s.id]||'')}</textarea><p id="reasoningNote">${esc(storageNotice())} Compare your explanation with the feedback.</p></div>`):'';
  const checkLabel=q.reasoningPrompt?'Compare reasoning':'Check choice';
  const instruction=q.reasoningPrompt?'Choose an option. Write your reasoning below, then select Compare reasoning.':'Choose an option, then select Check choice.';
  body=quizContextHTML(q)+`<p class="question">${esc(q.prompt)}</p>
   ${printing?'':`<p class="exercise-instruction">${instruction}</p>`}
   <div class="choices" role="group" aria-label="Answer options">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" data-answer="${i}" aria-pressed="${chosen===i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>
   ${prompt}${printing?`<p class="feedback">Suggested answer: ${String.fromCharCode(65+q.correct)}. ${esc(q.feedback[q.correct])}</p>`:
   `<button id="checkChoice" class="check-choice ${showFeedback?'':'primary'}" ${chosen===undefined||showFeedback?'disabled':''} ${showFeedback?'hidden':''}>${checkLabel}</button>
   <div id="choiceResult" ${showFeedback?'':'hidden'}><p class="feedback" tabindex="-1">${showFeedback?quizFeedback(q,chosen):''}</p><button id="playFeedback" class="check-choice">Play feedback</button></div>`}`;
 }
 else if(s.kind==='story'){
  const sceneText=s.text.split(/\n\s*\n/).slice(0,2).join('\n\n');
  body=`<div class="story-opening">${paragraphs(sceneText,c,printing)}</div>`;
 }
 else if(s.kind==='evidence'||(s.kind==='concept'&&!printing)){body=`<div class="evidence-body">${paragraphs((!printing&&s.readingText)||s.text,c,printing)}</div>`;}
 else{
  const recall=s.kind==='recall';
  if(recall&&!printing)body='<p class="exercise-instruction">Answer both questions from memory. Give your own example for one answer, then reveal the suggested answers.</p>';
  const list=recall?'ol':'ul';
  body+=`<${list} class="slide-points">${s.points.map(p=>`<li>${s.kind==='concept'?conceptPointHTML(p,c,printing):esc(p)}</li>`).join('')}</${list}>`;
  if(recall)body+=printing?`<div class="answers">${s.answers.map((a,i)=>`<p>${i+1}. ${esc(a)}</p>`).join('')}</div>`:`<details class="recall-reveal" ${revealed[s.id]?'open':''}><summary id="reveal">Reveal suggested answers</summary>${recallAnswers(s)}</details>`;
 }
 if(s.kind==='practice')body+='<p class="practice-tip">Try the recall questions again tomorrow and in a week. Use a different example each time.</p>';
 const caption=['concept','evidence'].includes(s.kind)?diagramCaption(c,s):'';
 return `<section class="slide ${s.kind} ${s.quiz?.record?'has-record':''} ${s.quiz?.reasoningPrompt?'written-decision':''} ${['concept','evidence'].includes(s.kind)?'teaching-step':''} ${s.id==='c01s05b'?'reasoning-lesson':''} ${['c01s03b','c01s04'].includes(s.id)?'focused-lesson':''}" style="--accent:${c.color}" aria-label="Chapter ${c.number}, ${s.stage}"><div class="slide-copy">${printing?`<div class="slide-stage">Chapter ${c.number} · ${esc(s.stage)}</div>`:''}<h2 id="${printing?'print-'+s.id:'slideTitle'}" tabindex="-1">${esc(s.title)}</h2>${body}${researchHTML(s,printing)}${printing?`<div class="scene-tag">${esc(c.title)} · ${s.id}</div>`:''}</div><div class="slide-art">${scene(c.icon,s.kind,s.id)}${caption?`<div class="art-caption">${esc(caption)}</div>`:''}${printing?'':moreVisuals(s)}</div></section>`;
}
function audioControls(){
 return `<div class="player-controls" aria-label="Narration controls">
 <div class="audio-group"><button id="read">Play narration</button><button id="pause" hidden>Pause</button><button id="stop" hidden>Stop</button></div>
 <details class="audio-settings"><summary>Narration speed</summary><label class="sr-only" for="speed">Playback speed</label><select id="speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select></details>
 <p id="audioStatus" class="audio-status" role="status"></p></div>`;
}
function navigation(c,s){
 const last=state.s===c.slides.length-1;
 const nextLabel=last?(state.c<COURSE.length-1?'Next chapter':c.number===10?'Final case':'Chapter overview'):'Next';
 return `<nav class="nav-group lesson-navigation" aria-label="Lesson navigation">
 <button id="prev" ${state.c===0&&state.s===0?'disabled':''}>Previous</button>
 <span class="slide-number" aria-label="Slide ${state.s+1} of ${c.slides.length}">${state.s+1} / ${c.slides.length}</span>
 <button id="next" class="${(s.quiz&&!checked[s.id])||(s.kind==='recall'&&!revealed[s.id])?'':'primary'}">${nextLabel}</button></nav>`;
}
function player(){
 const c=COURSE[state.c],s=c.slides[state.s];
 visited[s.id]=true;
 save();
 document.documentElement.style.setProperty('--accent',c.color);
 $('#app').innerHTML=header()+`<main id="main" class="player">
 <div class="player-heading"><div><div class="chapter-label">Chapter ${c.number} · ${esc(c.topic)}</div><h1 class="player-title">${esc(c.title)}</h1></div>
 <details class="chapter-navigation"><summary>Chapter slides</summary><ol>${c.slides.map((x,i)=>`<li><a href="#chapter-${c.number}-slide-${slideToken(x)}" ${i===state.s?'aria-current="step"':''}>${esc(x.stage)}</a></li>`).join('')}</ol></details></div>
 ${s.kind==='story'?`<p class="chapter-objective">${esc(c.objective)}</p>`:''}
 ${audioControls()}${slideHTML(c,s)}${navigation(c,s)}
 <div class="transcript">
 <details><summary>Narration transcript</summary>${paragraphs(NARRATION_TEXT[s.id]||s.text,c,true)}<div id="responseTranscript">${qTranscript(s)}</div></details>
 <div class="resources">${!storageAvailable?`<p class="progress-caption">${esc(storageNotice())}</p>`:''}${glossaryHTML(c)}<details class="chapter-reading"><summary>Chapter reading and sources</summary>${evidenceHTML(c)}${c.refs.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join('')}</details></div>
 </div></main>`;
 $('#prev').onclick=()=>move(-1);
 $('#next').onclick=()=>move(1);

function bindQuiz(s){
 const field=$('#decisionReasoning'),check=$('#checkChoice'),result=$('#choiceResult');
 const options=[...document.querySelectorAll('[data-answer]')];
 if(field)field.oninput=()=>{
  reasoning[s.id]=field.value;
  save();
  if(!storageAvailable)$('#reasoningNote').textContent=storageNotice();
 };
 options.forEach((button,i)=>button.onclick=()=>{
  stop();
  answers[s.id]=i;
  delete checked[s.id];
  options.forEach((option,j)=>{
   option.classList.toggle('selected',j===i);
   option.setAttribute('aria-pressed',String(j===i));
  });
  check.hidden=false;
  check.disabled=false;
  check.classList.add('primary');
  result.hidden=true;
  $('#next').classList.remove('primary');
  $('#responseTranscript').innerHTML='';
  save();
 });
 check.onclick=()=>{
  stop();
  checked[s.id]=true;
  save();
  $('.feedback').innerHTML=quizFeedback(s.quiz,answers[s.id]);

  result.hidden=false;
  $('#next').classList.add('primary');

 };

}
function evidenceHTML(c){const e=EVIDENCE[String(c.number)];return `<div class="evidence-note"><h3>Evidence and limits</h3>${e.note.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}${e.sources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a><p class="small muted">${esc(r.kind)}</p>`).join('')}</div>`;}
function qTranscript(s){let text='';if(s.quiz&&checked[s.id])text=NARRATION_TEXT[s.id+'-feedback-'+answers[s.id]];if(s.kind==='recall'&&revealed[s.id])text=NARRATION_TEXT[s.id+'-answers'];return text?`<p style="white-space:pre-line">${esc(text)}</p>`:'';}

function go(c,s){const hash=`#chapter-${COURSE[c].number}-slide-${slideToken(COURSE[c].slides[s])}`;if(location.hash===hash){route();}else location.hash=hash;}
function move(d){let c=state.c,s=state.s+d;if(s<0){c--;if(c<0)return;s=COURSE[c].slides.length-1;}if(s>=COURSE[c].slides.length){c++;s=0;}if(c<0)return;if(c>=COURSE.length){location.hash=COURSE[c-1].number===10?'case':'home';return;}go(c,s);}
function bindHeader(){if($('#homeButton'))$('#homeButton').onclick=()=>{location.hash='home';};if($('#printButton'))$('#printButton').onclick=()=>{buildPrint();window.print();};}
function stop(message=''){
 generation++;if(audioPlayer){audioPlayer.pause();audioPlayer.onended=null;audioPlayer.onerror=null;audioPlayer.removeAttribute('src');audioPlayer.load();audioPlayer=null;}
 playing=false;paused=false;
 if($('#read')){
  const restoreFocus=['pause','stop'].includes(document.activeElement.id);
  $('#read').textContent='Play narration';
  $('#pause').hidden=true;
  $('#pause').textContent='Pause';
  $('#stop').hidden=true;
  $('#audioStatus').textContent=message;
  if(restoreFocus)$('#read').focus();
 }
}
function read(onlyQueue){
 stop();const current=++generation;const s=COURSE[state.c].slides[state.s];const queue=Array.isArray(onlyQueue)?onlyQueue.slice():[s.id];
 if(!Array.isArray(onlyQueue)&&s.quiz&&checked[s.id])queue.push(s.id+'-feedback-'+answers[s.id]);
 if(!Array.isArray(onlyQueue)&&s.kind==='recall'&&$('.recall-reveal').open)queue.push(s.id+'-answers');
 let i=0;
 function failed(){if(current!==generation)return;stop('The recording could not play. Open Narration transcript below, or try Play narration again.');}
 function playNext(){
  if(current!==generation)return;
  if(i>=queue.length){stop('Narration complete.');$('#read').textContent='Play again';return;}
  const recording=RECORDED_AUDIO[queue[i++]];if(!recording){failed();return;}
  audioPlayer=new Audio(recording);audioPlayer.preload='auto';audioPlayer.playbackRate=window.readSpeed||1;audioPlayer.onended=playNext;audioPlayer.onerror=failed;
  const pending=audioPlayer.play();if(pending)pending.catch(failed);
 }
 playing=true;$('#read').textContent='Restart narration';$('#pause').hidden=false;$('#stop').hidden=false;$('#audioStatus').textContent=Array.isArray(onlyQueue)?'Playing feedback.':'Playing narration.';playNext();
}
function togglePause(){
 if(!playing||!audioPlayer)return;
 if(paused){paused=false;$('#pause').textContent='Pause';$('#audioStatus').textContent='Narration resumed.';const pending=audioPlayer.play();if(pending){const current=generation;pending.catch(()=>{if(current===generation)stop('Playback could not resume. Select Play narration to start again.');});}}
 else{audioPlayer.pause();paused=true;$('#pause').textContent='Resume';$('#audioStatus').textContent='Narration paused.';}
}
function buildPrint(){ $('#print').innerHTML=COURSE.flatMap(c=>c.slides.map(s=>slideHTML(c,s,true))).join('');}
const caseStorageKey='common-ground-final-case-v1';

 $('#app').innerHTML=header()+`<main id="main" class="wrap case-wrap"><h1>Final written case</h1>

 <p id="case-save-note">${esc(storageNotice())}</p>

 <label for="case-answer-${i}"><strong>${esc(t.title)}</strong><br>${esc(t.prompt)}</label>
 <textarea id="case-answer-${i}" data-case-answer="${i}" rows="4" maxlength="5000">${esc(typeof caseResponses[i]==='string'?caseResponses[i].slice(0,5000):'')}</textarea>
 </li>`).join('')}</ol></section>
 <details><summary>Compare with suggested reasoning</summary>${c.tasks.map((t,i)=>`<h3>${i+1}. ${esc(t.title)}</h3><p>${esc(t.answer)}</p><p class="small muted">Revisit chapters ${t.chapters.join(', ')}.</p>`).join('')}</details>
 <details><summary>Check your explanation against the rubric</summary><div class="case-rubric">${c.rubric.map(r=>`<div><h3>${esc(r.title)}</h3><p><strong>Stronger</strong> ${esc(r.strong)}</p><p><strong>Needs development</strong> ${esc(r.developing)}</p></div>`).join('')}</div><p>${esc(c.followup)}</p></details>

function route(){const m=location.hash.match(/^#chapter-(\d+)-slide-(\d+[a-z]?)$/);if(m){const i=COURSE.findIndex(c=>c.number===+m[1]);const s=i<0?-1:COURSE[i].slides.findIndex(s=>slideToken(s)===m[2]);if(i>=0&&s>=0){stop();state={view:'player',c:i,s};player();focusMain();return;}}if(location.hash==='#case'){learningCase();return;}if(location.hash==='#about'){about();focusMain();return;}stop();state.view='home';home();focusMain();}
